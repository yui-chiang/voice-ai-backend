[tool.poetry]
name = "voice-expense-ai-backend"
version = "0.1.0"
description = "FastAPI backend for Voice Expense AI"
authors = ["Antigravity <assistant@google.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.27.1"
python-multipart = "^0.0.9"
groq = ">=0.4.0"
pydantic = "^2.6.3"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
